<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>Updating HAPI</title>
    <style>
        :root { font-family: system-ui, sans-serif; color-scheme: dark; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #1d1d1f; color: #f5f5f7; }
        main { width: min(28rem, calc(100vw - 3rem)); text-align: center; }
        p { color: #a1a1a6; line-height: 1.5; }
    </style>
</head>
<body>
    <main>
        <h1>Updating HAPI…</h1>
        <p id="status">Removing the stale offline build.</p>
    </main>
    <script>
        (async () => {
            try {
                const registrations = 'serviceWorker' in navigator
                    ? await navigator.serviceWorker.getRegistrations()
                    : []
                await Promise.all(registrations.map((registration) => registration.unregister()))

                const cacheNames = 'caches' in window ? await caches.keys() : []
                await Promise.all(cacheNames.map((name) => caches.delete(name)))

                location.replace('/?updated=' + Date.now())
            } catch (error) {
                document.getElementById('status').textContent =
                    'Automatic update failed. Clear this site’s cached data and reopen HAPI.'
            }
        })()
    </script>
</body>
</html>
